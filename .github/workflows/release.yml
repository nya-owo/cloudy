# Pushing a tag such as v1.0.0 builds the apps of Windows, signs their
# updates, and uploads them to a draft release of the tag, which is published
# by hand: installed apps update to it then. Linux isn't built: the app hasn't
# been tried there, so it isn't offered.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow.
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        # The runner's own Ubuntu mirrors have failed to resolve for a while
        # (1.2.10): another mirror then, under another domain.
        run: |
          sudo apt-get update && sudo apt-get install -y nsis && exit 0
          list=/etc/apt/sources.list.d/fallback-mirror.list
          for mirror in http://mirrors.edge.kernel.org/ubuntu http://mirror.us.leaseweb.net/ubuntu; do
            echo "deb $mirror $(lsb_release -cs) main universe" | sudo tee "$list"
            opts="-o Dir::Etc::sourcelist=$list -o Dir::Etc::sourceparts=-"
            sudo apt-get update $opts && sudo apt-get install -y $opts nsis && exit 0
          done
          exit 1
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
      # The release holds the two installers and what installed apps update
      # from (the manifests and archives): the install script and its
      # checksums aren't offered, and mygo.json asks for no deltas.
      - name: Leave out the install script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in install.ps1 SHA256SUMS; do
            gh release delete-asset "$GITHUB_REF_NAME" "$name" --repo "$GITHUB_REPOSITORY" --yes || true
          done
